name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Serialize production deployments so Vercel always promotes the most recent
# build. cancel-in-progress: false ensures an in-flight run is never aborted
# mid-deployment; the pending run is still dropped in favour of the newest one.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy:
    name: 🚀 Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web
          github-comment: false
