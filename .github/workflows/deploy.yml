name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Serialize production deployments so Vercel always promotes the most recent
# build. cancel-in-progress: false ensures an in-flight run is never aborted
# mid-deployment; the pending run is still dropped in favour of the newest one.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy:
    name: 🚀 Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      # Every Vercel CLI step runs from the REPOSITORY ROOT, mirroring how
      # native git integration deploys a monorepo: the dashboard Root
      # Directory (apps/web) is applied ON TOP OF the working directory.
      # Running inside apps/web therefore double-prefixes paths during
      # output collection (apps/web/apps/web/.next → ENOENT). From the
      # root, the same setting resolves correctly and `vercel build`
      # executes the project's workspace-aware build command itself,
      # emitting .vercel/output at the root for --prebuilt deployment.
      - name: 🔗 Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: '📥 Pull project settings'
        run: npx vercel@50 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The dashboard project has an empty Root Directory and a custom root
      # Build Command (`pnpm run build`). With that shape vercel builds the
      # workspace from the monorepo root but then collects Next.js output
      # from <root>/.next instead of apps/web/.next and falls back to a
      # static "public/" deployment ("No Output Directory named public").
      # We cannot edit team settings from CI, so patch the PULLED local
      # settings instead: point rootDirectory at apps/web and use the
      # workspace-aware filter build. The build then runs tokenless so the
      # CLI cannot re-fetch and clobber these overrides.
      - name: '🩹 Point pulled settings at apps/web'
        run: |
          node -e "
            const fs = require('fs');
            const p = '.vercel/project.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.settings.rootDirectory = 'apps/web';
            j.settings.buildCommand =
              'pnpm --filter @recheq/web... --workspace-concurrency=1 build';
            fs.writeFileSync(p, JSON.stringify(j));
            console.log('settings:', JSON.stringify(j.settings));
          "

      # NOTE: VERCEL_TOKEN is intentionally NOT available here — its mere
      # presence makes the CLI re-fetch project settings from the API,
      # discarding the local overrides above.
      - name: 🏗️ Build with Vercel
        run: npx vercel@50 build --prod

      - name: 🚀 Deploy prebuilt output
        run: npx vercel@50 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --meta githubCommitSha="${{ github.sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
