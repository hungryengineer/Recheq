name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Serialize production deployments so Vercel always promotes the most recent
# build. cancel-in-progress: false ensures an in-flight run is never aborted
# mid-deployment; the pending run is still dropped in favour of the newest one.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy:
    name: 🚀 Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      # Build on the runner where the full pnpm workspace is present, then
      # upload only the compiled output. CLI deploys resolve settings from the
      # uploaded directory, so a monorepo root upload can neither run the
      # workspace filter build nor locate apps/web/.next — prebuilt avoids
      # both problems and any dependence on dashboard Root Directory state.
      - name: 🔗 Link Vercel project
        working-directory: apps/web
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: '📥 Pull project settings'
        working-directory: apps/web
        run: npx vercel@50 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Pulled settings carry the dashboard Root Directory; we already run
      # inside apps/web, so a non-empty rootDirectory double-prefixes paths
      # (apps/web/apps/web/.next) and breaks output collection.
      # Scrub rootDirectory from ALL Vercel config files to prevent this.
      - name: '🧹 Scrub rootDirectory from pulled settings'
        working-directory: apps/web
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const scrub = (o) => {
              if (o && typeof o === 'object') {
                delete o.rootDirectory;
                for (const v of Object.values(o)) scrub(v);
              }
            };
            // Scrub project.json (link + settings)
            for (const f of ['project.json', 'project/settings.json']) {
              const p = path.join('.vercel', f);
              if (!fs.existsSync(p)) continue;
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              scrub(j);
              fs.writeFileSync(p, JSON.stringify(j));
            }
          "
          echo '--- Vercel config after scrub ---'
          cat .vercel/project.json

      # IMPORTANT: Do NOT pass --token here. Vercel CLI v50 re-fetches
      # project settings from the API when --token is provided, which
      # restores rootDirectory and causes the double-prefix bug
      # (apps/web/apps/web/.next). Without --token, the CLI uses the
      # locally scrubbed settings. Environment variables are already
      # available from the prior `vercel pull` step.
      - name: 🏗️ Build with Vercel
        working-directory: apps/web
        run: npx vercel@50 build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy prebuilt output
        working-directory: apps/web
        run: npx vercel@50 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --meta githubCommitSha="${{ github.sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
