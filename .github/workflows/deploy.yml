name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Serialize production deployments so Vercel always promotes the most recent
# build. cancel-in-progress: false ensures an in-flight run is never aborted
# mid-deployment; the pending run is still dropped in favour of the newest one.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy:
    name: 🚀 Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4 # v4.2.2 @ 11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4 # v4.1.0 @ a3dadef06e4f0735bc657ce7f40f72e3d5124b4b
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4 # v4.4.0 @ 49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25 # v25.2.0 @ 4971f93d66f3ded8aad3b4c14deb9fc3c0e5a40b
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web
          github-comment: false
