name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Serialize production deployments so Vercel always promotes the most recent
# build. cancel-in-progress: false ensures an in-flight run is never aborted
# mid-deployment; the pending run is still dropped in favour of the newest one.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy:
    name: 🚀 Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      # Run all Vercel CLI commands from the monorepo root. The Vercel
      # dashboard has rootDirectory set to "apps/web", which tells the CLI
      # where to find the Next.js app. Previously we ran from apps/web and
      # tried to scrub rootDirectory from pulled settings, but Vercel CLI
      # v50 re-fetches settings from the API during `build --prod --token`,
      # bypassing the local scrub and doubling the path to
      # apps/web/apps/web/.next. Running from the root avoids this entirely.
      - name: 🔗 Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: '📥 Pull project settings'
        run: npx vercel@50 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build with Vercel
        run: npx vercel@50 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy prebuilt output
        run: npx vercel@50 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --meta githubCommitSha="${{ github.sha }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
