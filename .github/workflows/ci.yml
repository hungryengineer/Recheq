name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CI: true
  NODE_ENV: test

jobs:
  security-scan:
    name: 🔒 Stage 1 - Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate secret scanning across commits

      - name: 🕵️‍♂️ Check for Leaked Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    name: 🧹 Stage 2 - Static Analysis
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 💅 Check formatting
        run: pnpm format:check

      - name: 🚨 Run linter
        run: pnpm lint

      - name: 📜 Check API Contract
        run: pnpm check:contract

  unit-tests:
    name: 🧪 Stage 3 - Unit Testing
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tieout
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tieout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🃏 Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://tieout:password@localhost:5432/tieout_test

  build-artifacts:
    name: 🏗️ Stage 4 - Typecheck & Build
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏷️ Run typecheck
        run: pnpm typecheck

      - name: 📦 Build packages
        run: pnpm build

      - name: 🧩 Fixture Validation (OPS-05 Gate)
        run: bash scripts/ci-fixtures.sh

  reliability-measurement:
    name: 📏 Stage 5 - Reliability Measurement
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      # RCQ-20122 — reruns on every PR so the published numbers in
      # docs/reliability.md can never go stale. Floors are regression gates;
      # tighten them as the corpus and engine improve.
      - name: 📏 Measure precision & recall over the labelled corpus
        run: pnpm measure:reliability -- --min-precision 0.9 --min-recall 0.9

      - name: 📄 Generate measurement report
        if: always()
        run: pnpm measure:reliability -- --json > reliability-report.json && cat reliability-report.json

      - name: 📤 Upload measurement report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reliability-report
          path: reliability-report.json
          if-no-files-found: warn
