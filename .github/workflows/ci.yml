name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CI: true
  NODE_ENV: test

jobs:
  security-scan:
    name: 🔒 Stage 1 - Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for accurate secret scanning across commits

      - name: 🕵️‍♂️ Check for Leaked Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-review-ai:
    name: 🐰 Stage 1b - AI Code Review (CodeRabbit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐰 CodeRabbit AI Review
        uses: coderabbitai/github-action@latest
        with:
          debug: false
          framework: typescript
          language: en

  static-analysis:
    name: 🧹 Stage 2 - Static Analysis
    needs: [security-scan, code-review-ai]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 💅 Check formatting
        run: pnpm format:check

      - name: 🚨 Run linter
        run: pnpm lint

  unit-tests:
    name: 🧪 Stage 3 - Unit Testing
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tieout
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tieout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🃏 Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgres://tieout:password@localhost:5432/tieout_test

  build-artifacts:
    name: 🏗️ Stage 4 - Typecheck & Build
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Check out repository
        uses: actions/checkout@v4

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏷️ Run typecheck
        run: pnpm typecheck

      - name: 📦 Build packages
        run: pnpm build

      - name: 🧩 Fixture Validation (OPS-05 Gate)
        run: bash scripts/ci-fixtures.sh
